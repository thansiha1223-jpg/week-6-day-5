<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>

    <body class="min-h-screen bg-gray-100 flex items-center justify-center">

        <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-8">

            <!-- Heading -->
            <h1 class="text-3xl font-bold text-center text-gray-800 mb-6">
                Login
            </h1>

            <!-- Error Message -->
            {% if error %}
            <p class="bg-red-100 text-red-600 px-4 py-3 rounded-lg mb-4 text-center">
                {{ error }}
            </p>
            {% endif %}

            <!-- Login Form -->
            <form method="POST" class="space-y-5">

                {% csrf_token %}

                <!-- Username -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Username
                    </label>

                    <input type="text" name="username" placeholder="Enter your username" required class="w-full px-4 py-3 border border-gray-300 rounded-lg
                           focus:outline-none focus:ring-2 focus:ring-blue-500
                           focus:border-blue-500">
                </div>

                <!-- Password -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">
                        Password
                    </label>

                    <input type="password" name="password" placeholder="Enter your password" required class="w-full px-4 py-3 border border-gray-300 rounded-lg
                           focus:outline-none focus:ring-2 focus:ring-blue-500
                           focus:border-blue-500">
                </div>

                <!-- Login Button -->
                <button type="submit" class="w-full bg-blue-600 text-white py-3 rounded-lg
                       font-semibold hover:bg-blue-700
                       transition duration-300">
                    Login
                </button>

            </form>

            <!-- Register -->
            <p class="text-center text-gray-600 mt-6">
                Don't have an account?
                <a href="{% url 'register' %}" class="text-blue-600 font-semibold hover:underline">
                    Register
                </a>
            </p>

        </div>
    </body>

</html>
